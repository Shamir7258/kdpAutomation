# Single external entrypoint: proxies /api/* to the backend and everything
# else to the static frontend build. Puts both services behind one origin
# so the browser sees no cross-origin requests in production.
server {
    listen 80;
    server_name _;

    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:4000/healthz;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
